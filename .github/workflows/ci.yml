name: CI/CD — Backoffice

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]

jobs:
  # ─── Lint, Typecheck & Build ────────────────────────────────────────────────
  test:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ─── Deploy → Firebase Hosting ──────────────────────────────────────────────
  deploy:
    name: Deploy → Firebase Hosting
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Site Público → spartacus.app.br
        run: |
          npx firebase-tools deploy \
            --only hosting:public-site \
            --project=${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive

      - name: Deploy Backoffice → backoffice.spartacus.app.br
        run: |
          npx firebase-tools deploy \
            --only hosting:backoffice \
            --project=${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive
